name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: rustfmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy --all-targets --verbose -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # Releases ship a Windows binary (#215): run the offline suite there too, so
  # a Unix-only assumption fails the pull request instead of the release.
  windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: cargo test --locked
  read_msrv:
    name: Read MSRV
    uses: actions-rust-lang/msrv/.github/workflows/msrv.yml@main

  build_and_test:
    uses: actions-rust-lang/msrv/.github/workflows/msrv.yml@main
    needs:
      - read_msrv

    strategy:
      fail-fast: false
      matrix:
        version:
          - { name: msrv, version: "${{ needs.read_msrv.outputs.msrv }}" }
          - { name: stable, version: stable }