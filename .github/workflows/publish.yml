name: Publish

on:
  push:
    tags:
      - "*"
  # A change to the release pipeline is built (every target) and its Homebrew
  # formula test-installed on the pull request, so it can't first break at
  # release time. Nothing is published from a pull request.
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - ".github/homebrew/**"

# Build jobs only read the repository; the single release job below is the
# only one allowed to write (attach assets to the release).
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux builds link against glibc 2.17 through `cargo zigbuild` (the
        # `.2.17` target suffix): built natively on ubuntu-latest, the binary
        # required glibc >= 2.39 and failed on Debian 12, Ubuntu 22.04, and
        # RHEL 8/9. 2.17 is the oldest glibc with aarch64 support, so both
        # architectures share one floor. zigbuild also cross-compiles aarch64
        # without a separate gcc toolchain.
        #
        # `smoke` marks the binaries this runner can execute; they are run once
        # before upload.
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            glibc: "2.17"
            asset_name: tlschecker-linux-x86_64
            smoke: true
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            glibc: "2.17"
            asset_name: tlschecker-linux-aarch64
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            asset_name: tlschecker-macos-x86_64
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            asset_name: tlschecker-macos-aarch64
            smoke: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: tlschecker-windows-x86_64
            exe: .exe
            smoke: true

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild
        if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (Linux, glibc ${{ matrix.glibc }})
        if: matrix.glibc
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The C runtime is linked statically, so the .exe runs without the
      # Visual C++ redistributable; vendored OpenSSL compiles its objects with
      # /Zl, so they follow whichever runtime the final link picks. OpenSSL's
      # Configure needs a Windows perl: the default pwsh shell finds the
      # runner's Strawberry Perl, while `shell: bash` would put Git's MSYS
      # perl first, which Configure rejects for MSVC targets.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: target/${{ matrix.target }}/release/tlschecker${{ matrix.exe }} --version

      # The runner has the Visual C++ redistributable, so the smoke test can't
      # catch a dynamic CRT; its import of VCRUNTIME140.dll can.
      - name: Check the C runtime is static
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if grep -aqi 'vcruntime140' target/${{ matrix.target }}/release/tlschecker.exe; then
            echo "::error::tlschecker.exe imports the Visual C++ runtime (VCRUNTIME140.dll)"
            exit 1
          fi

      # A tarball keeps the executable bit and is the name the README's
      # install instructions download.
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # macOS tar would otherwise store extended attributes (e.g.
          # com.apple.provenance) as `._tlschecker` entries; GNU tar ignores it.
          COPYFILE_DISABLE: "1"
        run: |
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/tlschecker" "$staging/"
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C "$staging" tlschecker
          shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"

      # A zip is what Windows opens natively. The checksum file has the same
      # `<hash>  <name>` line as `shasum`, so `sha256sum -c` reads both.
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "${{ matrix.asset_name }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/tlschecker.exe" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $zip`n")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.*
          if-no-files-found: error

  # One job attaches everything, so the builds can't race to create the
  # release, and only this job holds write access.
  release:
    name: Attach assets to the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  # Commits Formula/tlschecker.rb to <owner>/homebrew-tap, so
  # `brew install jbovet/tap/tlschecker` follows each release. Pushing needs
  # the HOMEBREW_TAP_TOKEN secret (a fine-grained token with Contents
  # read/write on the tap repository only); without it the formula is left in
  # the job summary and the job still passes. Pre-releases (a tag with `-`,
  # e.g. v3.0.0-rc.1) stay off Homebrew.
  homebrew:
    name: Update the Homebrew tap
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate the formula
        run: |
          .github/homebrew/formula.sh "${GITHUB_REF_NAME#v}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            dist > tlschecker.rb
          { echo '```ruby'; cat tlschecker.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the formula is in the job summary, not pushed."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp tlschecker.rb tap/Formula/tlschecker.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tlschecker.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged."
            exit 0
          fi
          git commit -m "tlschecker ${GITHUB_REF_NAME#v}"
          git push origin HEAD

  # On a pull request: install the formula from this run's archives through a
  # local tap, run its test block, and check the completions were generated.
  homebrew-test:
    name: Test the Homebrew formula
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Install, test and uninstall
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          brew tap-new --no-git local/tlschecker
          tap=$(brew --repository local/tlschecker)
          mkdir -p "$tap/Formula"
          .github/homebrew/formula.sh "$version" "file://$PWD/dist" dist > "$tap/Formula/tlschecker.rb"
          brew install --formula local/tlschecker/tlschecker
          brew test local/tlschecker/tlschecker
          test -s "$(brew --prefix)/share/zsh/site-functions/_tlschecker"
          test -s "$(brew --prefix)/etc/bash_completion.d/tlschecker"
          test -s "$(brew --prefix)/share/fish/vendor_completions.d/tlschecker.fish"
          brew uninstall local/tlschecker/tlschecker
