# tlschecker on Kubernetes — reference manifests.
#
# Three patterns are shown:
#   1. CronJob (below, active)        — scheduled checks; alert on Job failure.
#   2. One-shot Job (commented)       — run once, e.g. in CI or ad hoc.
#   3. CronJob + Prometheus (comment) — push metrics to a Pushgateway instead of
#                                       relying on the exit code.
#
# Image tags follow the published scheme (semver, no `v` prefix): 2.0.0, 2.0, 2, latest.
# Pin a specific version in production rather than tracking `latest`.
#
# Exit codes (tlschecker 3 fails by default; see the README's "Status & exit codes"):
#   0  every host checked, none Critical
#   1  certificate problem: a host is Critical (expired, revoked, not valid for
#      its name, or inside the critical expiry window) — a real finding
#   2  usage / configuration error — retrying cannot help
#   3  a host could not be checked (DNS, connection, handshake) — may be transient
#   4  internal error
#
# ---------------------------------------------------------------------------
# Pattern 1: scheduled check. The container exits 1 when a certificate is
# Critical and 3 when a host could not be checked. Exit 1 is the *signal we
# want* (not a transient error), so the podFailurePolicy fails the Job at once
# on 1, 2 or 4; exit 3 (e.g. a network blip) is retried up to backoffLimit.
# Alert on the resulting failed Job (e.g. kube_job_status_failed).
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tlschecker
  labels:
    app.kubernetes.io/name: tlschecker
spec:
  schedule: "0 0 * * *"            # daily at midnight (UTC)
  concurrencyPolicy: Forbid       # never overlap runs
  startingDeadlineSeconds: 120     # skip (don't backfill) if a run is >2m late
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2              # retries apply only to exit 3 (see podFailurePolicy)
      activeDeadlineSeconds: 300    # bound a hung TLS connection
      podFailurePolicy:
        rules:
        # A certificate problem (1), bad config (2) or internal error (4) is not
        # a flake: fail the Job immediately instead of retrying it.
        - action: FailJob
          onExitCodes:
            containerName: tlschecker
            operator: In
            values: [1, 2, 4]
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tlschecker
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534         # nobody
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: tlschecker
            image: josebovet/tlschecker:2.0.0
            imagePullPolicy: IfNotPresent
            args: ["expired.badssl.com", "-o", "json"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "50m"
                memory: "32Mi"
              limits:
                cpu: "250m"
                memory: "128Mi"

